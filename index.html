<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Kopelowitz Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="gate-style">
/* A page of a ruled register book: faint blue lines, one red margin rule, the form written on it. */
:root {
  --paper: #f7f5ef; --ink: #23262b; --muted: #636a74; --rule: #d9dfe8; --margin: #d7a6a0;
  --field: #ffffff; --edge: #b9c1cc; --accent: #1f5e9c; --accent-ink: #ffffff; --error: #a3341f;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16191d; --ink: #e8e6e1; --muted: #a0a7b1; --rule: #262c34; --margin: #6b3f3a;
    --field: #1e2228; --edge: #3d4652; --accent: #7fb2e8; --accent-ink: #0d1117; --error: #f0907c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16191d; --ink: #e8e6e1; --muted: #a0a7b1; --rule: #262c34; --margin: #6b3f3a;
  --field: #1e2228; --edge: #3d4652; --accent: #7fb2e8; --accent-ink: #0d1117; --error: #f0907c; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--sans);
  background-image:
    linear-gradient(to right, transparent 0 calc(16px + 44px), var(--margin) calc(16px + 44px) calc(16px + 46px), transparent calc(16px + 46px)),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
}
.gate { box-sizing: border-box; min-height: 100%; padding-block: max(64px, env(safe-area-inset-top, 0px)) 48px; padding-inline: calc(16px + 70px) 16px; display: flex; flex-direction: column; justify-content: center; }
.gate > * { max-width: 30rem; }
h1 { font: 500 clamp(2.1rem, 6vw, 3rem)/1.05 var(--serif); margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 0 0 32px; color: var(--muted); }
form { display: flex; flex-direction: column; gap: 14px; }
label[for="pw"] { font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
#pw { flex: 1 1 14rem; min-width: 0; font: 400 20px/1.2 var(--sans); padding: 12px 14px; border: 1.5px solid var(--edge); border-radius: 8px; background: var(--field); color: var(--ink); }
#pw:focus-visible, button:focus-visible, #remember:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { font: 600 18px var(--sans); padding: 12px 22px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button[disabled] { opacity: .6; cursor: progress; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
#remember { width: 20px; height: 20px; accent-color: var(--accent); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
#msg { min-height: 1.5em; margin: 0; font-size: 15px; }
#msg.error { color: var(--error); font-weight: 500; }
.foot { margin-top: 40px; font-size: 14px; color: var(--muted); }
@media (max-width: 480px) { body { background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); } .gate { padding-inline: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="gate" id="gate">
  <h1>Kopelowitz Family Tree</h1>
  <p class="lede">A private family site. Enter the family password to open it.</p>
  <form id="form" autocomplete="on">
    <label for="pw">Family password</label>
    <div class="row">
      <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
      <button id="go" type="submit">Open the tree</button>
    </div>
    <label class="check" for="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <p class="hint">Capitals and spaces don't matter.</p>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="foot">Don't have the password? Ask Sam.</p>
</main>

const tob64 = buf => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(password)), "PBKDF2", false, ["deriveKey"]);

    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function unseal(key) {
  const buf = unb64(PAYLOAD);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, key, buf.subarray(12));
